rsvplist.admin_settings:
  path: "/admin/config/content/rsvplist"
  defaults:
    _form: 'Drupal\rsvplist\Form\RSVPSettingsForm'
    _title: "RSVP List Settings"
  requirements:
    _permission: "administer rsvplist"

rsvplist.dbdemo:
  path: "/drupaldbdemo"
  defaults:
    _controller: 'Drupal\rsvplist\Controller\DBAPIExamples::getUsers'
    _title: "DB APIs in action"
  requirements:
    _permission: "access content"
