rsvplist.formdemo:
  path: "/rsvplistdemo"
  defaults:
    _form: 'Drupal\rsvplist\Form\RSVPForm'
    _title: "RSVP to this Event (demo)"
  requirements:
    _permission: "access content"

rsvplist.dbdemo:
  path: "/drupaldbdemo"
  defaults:
    _controller: 'Drupal\rsvplist\Controller\DBAPIExamples::getUsers'
    _title: "DB APIs in action"
  requirements:
    _permission: "access content"
